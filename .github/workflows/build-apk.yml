# GitHub에 올리면 자동으로 Android APK를 빌드하고 웹앱을 GitHub Pages로 배포합니다.
name: Build APK & Deploy Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMeasureLevel-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
      - name: Publish APK to 'apk' branch (바로 내려받기용)
        working-directory: .
        run: |
          mkdir /tmp/apkout
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/apkout/ARMeasureLevel-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/ARMeasureLevel-debug.apk
          cd /tmp/apkout
          printf '# 최신 APK\n\n- ARMeasureLevel-release.apk : 설치용(권장)\n- ARMeasureLevel-debug.apk : 테스트용\n\n빌드 커밋: %s\n' "$GITHUB_SHA" > README.md
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "APK build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
